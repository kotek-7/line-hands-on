<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do'er LINE</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app-shell">
    <section class="chat" aria-label="LINE風グループチャット">
      <header class="chat-header">
        <button class="icon-button" type="button" aria-label="戻る">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 19 8 12l7-7" />
          </svg>
        </button>
        <h1>Do'er LINE</h1>
        <div class="header-actions">
          <button class="icon-button" type="button" aria-label="検索">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m16 16 4 4" />
            </svg>
          </button>
          <button class="icon-button" type="button" aria-label="通話">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.7.6 2.5a2 2 0 0 1-.5 2.1L8 9.5a16 16 0 0 0 6.5 6.5l1.2-1.2a2 2 0 0 1 2.1-.5c.8.3 1.6.5 2.5.6a2 2 0 0 1 1.7 2Z" />
            </svg>
          </button>
          <button class="icon-button calendar-button" type="button" aria-label="カレンダー">
            <span>31</span>
            <i>N</i>
          </button>
          <button class="icon-button" type="button" aria-label="メニュー">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </header>

      <div id="feed" class="feed" aria-live="polite">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">💬</div>
          <p>まだメッセージはありません</p>
          <small>script.js を動かして表示してみよう</small>
        </div>
      </div>

      <form id="message-form" class="composer">
        <div class="message-field">
          <button class="open-button" type="button" aria-label="メニューを開く">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
          <input id="message-input" name="body" type="text" placeholder="メッセージを入力" maxlength="300" autocomplete="off"
            required />
          <button class="stamp-button" type="button" aria-label="スタンプ">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M8 14s1.4 2 4 2 4-2 4-2M9 10h.01M15 10h.01" />
            </svg>
          </button>
          <button class="send-button" type="submit" aria-label="送信">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#638DFF">
              <path
                d="M176-183q-20 8-38-3.5T120-220v-180l320-80-320-80v-180q0-22 18-33.5t38-3.5l616 260q25 11 25 37t-25 37L176-183Z" />
            </svg>
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script type="module" src="script.js"></script>
</body>

</html>
